[package]
name = "genie-mcp"
description = "MCP client, transports, OAuth, connector directory client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Tiny MCP server the integration tests run over a real stdio pipe (via genie-process).
name = "genie-mcp-fake-server"
path = "src/bin/fake_server.rs"
