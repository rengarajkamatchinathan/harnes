[package]
name = "genie-process"
description = "Process runner: pipe mode, kill-tree, children bound to the daemon. PTY mode behind feature `pty` (D45, D55)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# PTY mode for Terminal tabs (D55): portable-pty + a vt100 screen for checkpoints.
pty = ["dep:portable-pty", "dep:vt100"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
portable-pty = { workspace = true, optional = true }
vt100 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
vt100.workspace = true
libc.workspace = true

[lints]
workspace = true
