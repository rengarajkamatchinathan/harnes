<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 60 60" width="120" height="120">
  <title>Genie</title>
  <style>
    g, polygon { transform-box: view-box; transform-origin: 32px 32px; }
    .t { animation: breathe 2.4s ease-in-out infinite; }
    .g { animation: none; }
    @keyframes breathe { 0%,100% { transform: scale(.9); } 50% { transform: scale(1); } }
    @keyframes turn { 0% { transform: rotate(0deg); } 100% { transform: rotate(120deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><polygon points="28.00,9.93 36.00,9.93 53.11,39.57 49.11,46.50 14.89,46.50 10.89,39.57" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/></mask>
  <g><polygon points="36.00,54.07 28.00,54.07 10.89,24.43 14.89,17.50 49.11,17.50 53.11,24.43" fill="#F9FAFB" mask="url(#cut)"/><polygon class="t" points="28.00,9.93 36.00,9.93 53.11,39.57 49.11,46.50 14.89,46.50 10.89,39.57" fill="#E8344E"/></g>
</svg>
