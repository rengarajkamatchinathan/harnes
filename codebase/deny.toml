# cargo-deny: licences and advisories (spec/01-architecture.md §2.1 rule 4).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# `notify` (settings/policy file watcher, D23) is CC0-1.0 (public-domain dedication).
[[licenses.exceptions]]
allow = ["CC0-1.0"]
crate = "notify"
# Our own crates.
[[licenses.exceptions]]
allow = ["LicenseRef-Synergech-Proprietary"]
crate = "genie-*"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
