[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "xtask"]
default-members = ["crates/*", "apps/cli"]

[workspace.package]
# One version for the whole repo (01 §2.1 rule 6).
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "LicenseRef-Synergech-Proprietary"
publish = false

[workspace.dependencies]
# internal (subsystem crates are added here when something depends on them)
genie-protocol = { path = "crates/genie-protocol" }
genie-core = { path = "crates/genie-core" }
genie-process = { path = "crates/genie-process" }
genie-audit = { path = "crates/genie-audit" }
genie-daemon = { path = "crates/genie-daemon" }
genie-client = { path = "crates/genie-client" }
genie-testkit = { path = "crates/genie-testkit" }
# external
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
schemars = "1"
secrecy = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "process", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# Lint-as-architecture (01 §2.1 rule 4). `clippy.toml` allows unwrap/expect in tests.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
